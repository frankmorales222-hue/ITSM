name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: itsm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:dev@localhost:5432/itsm
      SESSION_SECRET: ci-test-session-secret-not-for-real-use
      EMAIL_WEBHOOK_SECRET: ci-test-webhook-secret-not-for-real-use
      REDIS_URL: redis://localhost:6379
      TEST_DATABASE_URL: postgresql://postgres:dev@localhost:5432/itsm_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Install postgresql-client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create and migrate test database
        run: |
          psql "postgresql://postgres:dev@localhost:5432/postgres" -c "CREATE DATABASE itsm_test"
          npm run migrate:test

      - name: Integration tests
        run: npm run test:integration

      - name: Migrate dev-shaped database and build
        run: |
          npm run migrate
          npm run build

      - name: Start MinIO (no GH Actions service supports its custom command)
        run: |
          docker run -d --name minio -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data --console-address ":9001"
          timeout 30 sh -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done'

      - name: Create and migrate e2e database
        run: |
          psql "postgresql://postgres:dev@localhost:5432/postgres" -c "CREATE DATABASE itsm_e2e"
          TEST_DATABASE_URL="postgresql://postgres:dev@localhost:5432/itsm_e2e" npm run migrate:test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
