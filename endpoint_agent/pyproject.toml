[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-endpoint-agent"
version = "0.1.37"
description = "Standalone Windows inventory collector for Northstar Desk and Asset Inventory"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
northstar-agent = "asset_agent.agent:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["asset_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
