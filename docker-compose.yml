services:
  postgres:
    image: postgres:16
    container_name: itsm-postgres
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: itsm
    ports:
      - "5432:5432"
    volumes:
      - itsm-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: itsm-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: itsm-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - itsm-minio-data:/data

volumes:
  itsm-postgres-data:
  itsm-minio-data:
